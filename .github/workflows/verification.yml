name: Préparation du dépôt et tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Vérifier la syntaxe et la logique
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q custom_components tools tests

      - name: Exécuter les tests de logique
        run: python tests/run.py

  metadata:
    name: Renseigner les métadonnées GitHub
    needs: tests

    if: >-
      github.event_name != 'pull_request' &&
      github.event.repository.fork == false &&
      github.ref == format(
        'refs/heads/{0}',
        github.event.repository.default_branch
      )

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Récupérer la branche principale
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Renseigner le propriétaire et le dépôt
        run: python tools/prepare_repository.py

      - name: Enregistrer les modifications si nécessaire
        run: |
          if ! git diff --quiet -- custom_components/vigilance_meteo_mobile/manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/vigilance_meteo_mobile/manifest.json
            git commit -m "Configure repository metadata"
            git push
          fi
